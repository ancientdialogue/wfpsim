name: "Deploy Taghelper"
description: "builds and deploys the simpact taghelper to cloudflare. Assumes yarn setup has already ran"
inputs:
  apiToken:
    required: true
    description: cloudflare api token
  accountId:
    required: true
    description: cloudflare account id
  gitHubToken:
    required: true
    description: github token
  branch:
    required: true
    description: name of the branch

runs:
  using: composite
  steps:
    - name: Build UI
      working-directory: ./ui
      shell: bash
      run: yarn build:taghelper

    - name: List UI dist
      working-directory: ./ui/packages/taghelper/dist
      shell: bash
      run: ls -lh

    - name: Publish to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.apiToken }}
        accountId: ${{ inputs.accountId }}
        workingDirectory: ./ui/packages/taghelper
        command: pages deploy ./dist --project-name="taghelper" --branch="${{ inputs.branch }}"
